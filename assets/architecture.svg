<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1120" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a97a5"/>
    </marker>
    <linearGradient id="hd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d8fa8"/><stop offset="1" stop-color="#33b7cf"/>
    </linearGradient>
  </defs>

  <!-- self-contained background so it reads on light AND dark GitHub themes -->
  <rect x="0" y="0" width="900" height="1120" rx="18" fill="#f6f8fa"/>
  <rect x="0.5" y="0.5" width="899" height="1119" rx="18" fill="none" stroke="#d8e0e7"/>

  <text x="450" y="46" text-anchor="middle" font-size="26" font-weight="800" fill="#151a21" letter-spacing="-0.5">Fusion NIDS &#8212; how data flows</text>
  <text x="450" y="72" text-anchor="middle" font-size="14" fill="#5b6672">Traffic in &#8594; four engines vote &#8594; one risk score &#8594; evidence &amp; alerts out</text>

  <!-- connectors (drawn first, under boxes) with animated flow dots -->
  <g stroke="#8a97a5" stroke-width="2" fill="none">
    <line x1="450" y1="176" x2="450" y2="212" marker-end="url(#arw)"/>
    <line x1="450" y1="268" x2="450" y2="304" marker-end="url(#arw)"/>
    <line x1="450" y1="360" x2="450" y2="396" marker-end="url(#arw)"/>
    <line x1="450" y1="632" x2="450" y2="668" marker-end="url(#arw)"/>
    <line x1="450" y1="760" x2="450" y2="796" marker-end="url(#arw)"/>
    <line x1="450" y1="912" x2="450" y2="948" marker-end="url(#arw)"/>
  </g>
  <g fill="#0d8fa8">
    <circle r="4" cx="450" cy="176"><animate attributeName="cy" values="176;212" dur="1.1s" repeatCount="indefinite"/></circle>
    <circle r="4" cx="450" cy="268"><animate attributeName="cy" values="268;304" dur="1.1s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle r="4" cx="450" cy="360"><animate attributeName="cy" values="360;396" dur="1.1s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle r="4" cx="450" cy="632"><animate attributeName="cy" values="632;668" dur="1.1s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle r="4" cx="450" cy="760"><animate attributeName="cy" values="760;796" dur="1.1s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle r="4" cx="450" cy="912"><animate attributeName="cy" values="912;948" dur="1.1s" begin="1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 1. INPUT SOURCES -->
  <g>
    <rect x="210" y="96" width="480" height="80" rx="12" fill="#ffffff" stroke="#c2ccd6"/>
    <rect x="210" y="96" width="6" height="80" rx="3" fill="url(#hd)"/>
    <text x="234" y="122" font-size="12" font-weight="700" letter-spacing="1.5" fill="#0d8fa8">01 &#183; INPUT SOURCES</text>
    <text x="234" y="146" font-size="14" fill="#2b3540">Live NIC capture &#160;&#183;&#160; Offline PCAP replay &#160;&#183;&#160; Suricata JSON</text>
    <text x="234" y="164" font-size="14" fill="#2b3540">Zeek JSON &#160;&#183;&#160; Static artifact / file intake</text>
  </g>

  <!-- 2. INGEST -->
  <g>
    <rect x="270" y="212" width="360" height="56" rx="12" fill="#ffffff" stroke="#c2ccd6"/>
    <text x="450" y="238" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.2" fill="#0d8fa8">02 &#183; INGEST</text>
    <text x="450" y="258" text-anchor="middle" font-size="13" fill="#2b3540">one intake point for every source</text>
  </g>

  <!-- 3. PARSE / NORMALIZE -->
  <g>
    <rect x="270" y="304" width="360" height="56" rx="12" fill="#ffffff" stroke="#c2ccd6"/>
    <text x="450" y="330" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.2" fill="#0d8fa8">03 &#183; PARSE / NORMALIZE / FEATURES</text>
    <text x="450" y="350" text-anchor="middle" font-size="13" fill="#2b3540">packets &#8594; flows &#8594; common schema &#8594; features</text>
  </g>

  <!-- 4. DETECTION ENGINES -->
  <g>
    <rect x="150" y="396" width="600" height="236" rx="14" fill="#ffffff" stroke="#c2ccd6"/>
    <text x="450" y="424" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="1.4" fill="#151a21">04 &#183; DETECTION ENGINES</text>

    <!-- 4 colored engine chips -->
    <g>
      <rect x="176" y="440" width="270" height="58" rx="10" fill="#f6edd8" stroke="#b3801a"/>
      <circle cx="198" cy="469" r="6" fill="#b3801a"/>
      <text x="216" y="465" font-size="13" font-weight="700" fill="#7a5610">Signature</text>
      <text x="216" y="484" font-size="11.5" fill="#6b5518">YAML rules &#183; known fingerprints</text>
    </g>
    <g>
      <rect x="454" y="440" width="270" height="58" rx="10" fill="#e3f3f6" stroke="#0d8fa8"/>
      <circle cx="476" cy="469" r="6" fill="#0d8fa8"/>
      <text x="494" y="465" font-size="13" font-weight="700" fill="#0a6c80">Statistical</text>
      <text x="494" y="484" font-size="11.5" fill="#155e6d">EWMA &#183; z-score &#183; DNS burst</text>
    </g>
    <g>
      <rect x="176" y="506" width="270" height="58" rx="10" fill="#e6f4ec" stroke="#2f8f5b"/>
      <circle cx="198" cy="535" r="6" fill="#2f8f5b"/>
      <text x="216" y="531" font-size="13" font-weight="700" fill="#1f6b41">Supervised ensemble</text>
      <text x="216" y="550" font-size="11.5" fill="#215a3b">RF + ExtraTrees + HistGB + XGB</text>
    </g>
    <g>
      <rect x="454" y="506" width="270" height="58" rx="10" fill="#efeaf7" stroke="#6b4fb0"/>
      <circle cx="476" cy="535" r="6" fill="#6b4fb0"/>
      <text x="494" y="531" font-size="13" font-weight="700" fill="#503a8a">Unsupervised</text>
      <text x="494" y="550" font-size="11.5" fill="#493a75">IsolationForest + autoencoder</text>
    </g>

    <!-- fusion bar -->
    <rect x="176" y="576" width="548" height="40" rx="10" fill="#f8e5e9" stroke="#c2415a"/>
    <circle cx="205" cy="596" r="6" fill="#c2415a"/>
    <text x="222" y="601" font-size="13" font-weight="800" fill="#8f2c40">FUSION ENGINE</text>
    <text x="712" y="601" text-anchor="end" font-size="12" fill="#8f2c40">weighted &#8594; one risk score</text>
  </g>

  <!-- 5. SUPPRESS + RETAIN -->
  <g>
    <rect x="240" y="668" width="420" height="92" rx="12" fill="#ffffff" stroke="#c2ccd6"/>
    <text x="450" y="694" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.2" fill="#0d8fa8">05 &#183; SUPPRESS + RETAIN</text>
    <text x="450" y="716" text-anchor="middle" font-size="13" fill="#2b3540">known-safe repeats muted with an audit log</text>
    <text x="450" y="740" text-anchor="middle" font-size="12.5" fill="#5b6672">SQLite (nids.db) &#160;+&#160; JSONL (alerts / flows / metrics)</text>
  </g>

  <!-- 6. ANALYTICS / OUTPUT -->
  <g>
    <rect x="180" y="796" width="540" height="116" rx="12" fill="#ffffff" stroke="#c2ccd6"/>
    <rect x="180" y="796" width="6" height="116" rx="3" fill="url(#hd)"/>
    <text x="450" y="822" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="1.2" fill="#151a21">06 &#183; ANALYTICS &amp; OUTPUT</text>
    <text x="450" y="846" text-anchor="middle" font-size="13" fill="#2b3540">Live WebSocket dashboard (ACK / suppress / drift alerts)</text>
    <text x="450" y="868" text-anchor="middle" font-size="13" fill="#2b3540">Incident &amp; SLA reports &#160;&#183;&#160; offline graphs</text>
    <text x="450" y="892" text-anchor="middle" font-size="13" font-weight="700" fill="#2f8f5b">AI-assisted triage &#8212; local LLM, no data leaves the machine</text>
  </g>

  <!-- footer note -->
  <text x="450" y="984" text-anchor="middle" font-size="12" fill="#79838f">Research and portfolio project &#183; evidence-backed validation &#183; honest about its limits</text>

  <!-- legend -->
  <g font-size="11.5" fill="#5b6672">
    <text x="150" y="1030" font-weight="700" fill="#151a21">Four engines, one verdict:</text>
    <circle cx="163" cy="1054" r="5" fill="#b3801a"/><text x="176" y="1058">Signature</text>
    <circle cx="272" cy="1054" r="5" fill="#0d8fa8"/><text x="285" y="1058">Statistical</text>
    <circle cx="385" cy="1054" r="5" fill="#2f8f5b"/><text x="398" y="1058">Supervised</text>
    <circle cx="512" cy="1054" r="5" fill="#6b4fb0"/><text x="525" y="1058">Unsupervised</text>
    <circle cx="648" cy="1054" r="5" fill="#c2415a"/><text x="661" y="1058">Fusion</text>
  </g>
</svg>
