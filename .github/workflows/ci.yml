name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile source
        run: python -m compileall -q src tests scripts

      - name: Run tests
        run: |
          mkdir -p artifacts/coverage artifacts/test-results
          python -m pytest -q -m "not lab and not environment and not live" \
            --cov=src/nids --cov-config=.coveragerc \
            --cov-report=term:skip-covered \
            --cov-report=json:artifacts/coverage/coverage.json \
            --cov-report=xml:artifacts/coverage/coverage.xml \
            --junitxml=artifacts/test-results/junit.xml

      - name: Upload test and coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-validation-python-${{ matrix.python-version }}
          path: |
            artifacts/coverage
            artifacts/test-results
          if-no-files-found: error

      - name: Verify live capture at the minimum supported Scapy version
        run: |
          python -m pip install scapy==2.6.0
          python -m pytest -q tests/test_live_worker_lifecycle.py tests/test_live_capture_operational.py tests/test_live_ingest.py

  # The Dockerfile ships with the project but nothing ever built it. Not CI, and not
  # locally either - the last local build was 2026-06-08. So a base-image bump like
  # "python:3.11-slim -> 3.14-slim" (dependabot #18) had no test anywhere that could
  # catch a break before it reached a public repo.
  #
  # This builds the image and runs the packaged entrypoint's help, which is enough to
  # prove the base image, apt packages and pip install all still resolve together.
  # No registry push: the point is verification, not distribution.
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: fusion-nids:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deliberately not invoking the nids CLI here. `python -m nids --help` goes through
      # `from src.nids.cli import main` and pulls in scapy, so a failure would be
      # ambiguous between "the image is broken" and "the CLI needs a capture context".
      # These two checks cannot fail for reasons unrelated to the image: the first proves
      # the base image runs, the second proves the installed dependency graph is
      # self-consistent. The build step above already proves apt and pip resolve.
      - name: Smoke test the built image
        run: |
          docker run --rm fusion-nids:ci python -c "import sys; print(sys.version)"
          docker run --rm fusion-nids:ci pip check
          docker run --rm fusion-nids:ci python -m nids --help >/dev/null

