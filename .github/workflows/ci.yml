name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile source
        run: python -m compileall -q src tests scripts

      - name: Run tests
        run: |
          mkdir -p artifacts/coverage artifacts/test-results
          python -m pytest -q -m "not lab and not environment and not live" \
            --cov=src/nids --cov-config=.coveragerc \
            --cov-report=term:skip-covered \
            --cov-report=json:artifacts/coverage/coverage.json \
            --cov-report=xml:artifacts/coverage/coverage.xml \
            --junitxml=artifacts/test-results/junit.xml

      - name: Upload test and coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-validation-python-${{ matrix.python-version }}
          path: |
            artifacts/coverage
            artifacts/test-results
          if-no-files-found: error

      - name: Verify live capture at the minimum supported Scapy version
        run: |
          python -m pip install scapy==2.6.0
          python -m pytest -q tests/test_live_worker_lifecycle.py tests/test_live_capture_operational.py tests/test_live_ingest.py

  # Build the shipped image on every pull request and verify its Python runtime,
  # dependency graph, and packaged CLI entrypoint. No registry push: this job is
  # runtime verification, not distribution.
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: fusion-nids:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The runtime check exercises the packaged CLI import path in addition to the
      # interpreter and dependency consistency checks above.
      - name: Smoke test the built image
        run: |
          docker run --rm fusion-nids:ci python -c "import sys; print(sys.version)"
          docker run --rm fusion-nids:ci pip check
          docker run --rm fusion-nids:ci python -m nids --help >/dev/null

