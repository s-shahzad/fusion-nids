name: Dependabot auto-merge

# Merges Dependabot pull requests without a human, but only the low-risk ones.
#
# Deliberately narrow, because auto-merging dependencies is a supply-chain
# decision, not a convenience:
#
#   * Only patch and minor updates. Major bumps stay manual - they are the ones
#     that break native wheels and change APIs.
#   * Only after every required status check passes. This enables GitHub's
#     auto-merge rather than merging directly, so branch protection still
#     gates it and a red check leaves the PR sitting open.
#   * Only for the dependabot[bot] actor.
#
# A PR this workflow declines is not rejected - it simply waits for a human.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch and minor updates
        if: |
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Flag major updates for manual review
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr edit "$PR_URL" --add-label "needs-decision"
          gh pr comment "$PR_URL" --body \
            "Major version bump (\`${{ steps.meta.outputs.dependency-names }}\` ${{ steps.meta.outputs.previous-version }} to ${{ steps.meta.outputs.new-version }}). Auto-merge deliberately does not apply to major updates - these are the ones that break native wheels and change APIs. Review the CI run before merging."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
